name: Maintainer Fracture Wire Cron

on:
  schedule:
    # Runs every 6 hours at minute 22 (off-peak)
    - cron: '22 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-wire:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests pydantic duckdb

      - name: Execute Fracture Risk Engine
        run: |
          python3 main.py

      - name: Commit and push updates
        run: |
          git config user.name "fracture-bot[bot]"
          git config user.email "fracture-bot@users.noreply.github.com"
          git add -A data/
          
          if git diff --staged --quiet; then
            echo "No changes in maintainer risk scores. Skipping commit."
          else
            git commit -m "chore(fracture): update package maintainer risk metrics [skip ci]"
            git push origin main
          fi
